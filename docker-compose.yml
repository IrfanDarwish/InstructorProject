services:
  mongo:
    image: mongo:8
    container_name: instructorapi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: instructorapidb
    volumes:
      - mongo_data:/data/db


  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: instructorapi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_USERNAME: root
      MONGO_PASSWORD: root
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: instructorapidb
      MONGO_AUTH_DB: admin
      JWT_SECRET: 8xuD80BSoAus/+IpU/bSxeP1cfv3g47iLszq6Y/+XRM=
    depends_on:
      - mongo

  frontend:
    build: 
      context: ./instructor-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: instructorapi-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data: